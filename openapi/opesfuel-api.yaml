components:
  securitySchemes:
    auth0Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 RS256 Access Token with RBAC role claims
    tenantApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    StationId:
      name: stationId
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
  responses:
    ProblemDetail:
      description: RFC 9457 Problem Details error response
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
              instance: { type: string }
  schemas:
    StationDto:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        city: { type: string }
        currency: { type: string, enum: [FCFA] }
        planName: { type: string }
        monthlyFeeFcfa: { type: integer, format: int64 }
    CreateStationCommand:
      type: object
      required: [code, name, city]
      properties:
        code: { type: string }
        name: { type: string }
        city: { type: string }
    UpdateFuelPriceCommand:
      type: object
      required: [grade, pricePerLitreFcfa]
      properties:
        grade: { type: string, enum: [SUPER, GASOIL, KEROSENE, LPG_BULK, HEAVY_FUEL] }
        pricePerLitreFcfa: { type: integer, format: int64, minimum: 100 }
    FuelPriceDto:
      type: object
      properties:
        stationId: { type: string }
        grade: { type: string }
        pricePerLitreFcfa: { type: integer, format: int64 }
        effectiveAt: { type: string, format: date-time }
    PumpDto:
      type: object
      properties:
        id: { type: string }
        stationId: { type: string }
        code: { type: string }
        grade: { type: string, enum: [SUPER, GASOIL, KEROSENE, LPG_BULK, HEAVY_FUEL] }
        tankId: { type: string }
        totalizerLitres: { type: number }
        unitPriceFcfa: { type: integer, format: int64 }
        status: { type: string, enum: [IDLE, ACTIVE_SHIFT, MAINTENANCE] }
    ShiftDto:
      type: object
      properties:
        id: { type: string }
        stationId: { type: string }
        pumpId: { type: string }
        pumpCode: { type: string }
        grade: { type: string }
        attendantId: { type: string }
        attendantName: { type: string }
        openingMeterLitres: { type: number }
        closingMeterLitres: { type: number, nullable: true }
        litresSold: { type: number }
        unitPriceFcfa: { type: integer, format: int64 }
        expectedRevenueFcfa: { type: integer, format: int64 }
        cashFcfa: { type: integer, format: int64 }
        mobileMoneyFcfa: { type: integer, format: int64 }
        cardFcfa: { type: integer, format: int64 }
        fleetCreditFcfa: { type: integer, format: int64 }
        varianceFcfa: { type: integer, format: int64 }
        status: { type: string, enum: [OPEN, CLOSED] }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time, nullable: true }
    OpenShiftCommand:
      type: object
      required: [stationId, pumpId, attendantId]
      properties:
        stationId: { type: string }
        pumpId: { type: string }
        attendantId: { type: string }
    CloseShiftCommand:
      type: object
      required: [closingMeterLitres, cashFcfa, mobileMoneyFcfa, cardFcfa, fleetCreditFcfa]
      properties:
        closingMeterLitres: { type: number }
        cashFcfa: { type: integer, format: int64 }
        mobileMoneyFcfa: { type: integer, format: int64 }
        cardFcfa: { type: integer, format: int64 }
        fleetCreditFcfa: { type: integer, format: int64 }
    FleetAccountDto:
      type: object
      properties:
        id: { type: string }
        companyName: { type: string }
        taxId: { type: string }
        creditLimitFcfa: { type: integer, format: int64 }
        balanceOwedFcfa: { type: integer, format: int64 }
        status: { type: string, enum: [ACTIVE, HOLD] }
    RecordFleetVoucherCommand:
      type: object
      required: [accountId, stationId, vehiclePlate, driverName, grade, litres]
      properties:
        accountId: { type: string }
        stationId: { type: string }
        vehiclePlate: { type: string }
        driverName: { type: string }
        grade: { type: string, enum: [SUPER, GASOIL, KEROSENE, LPG_BULK, HEAVY_FUEL] }
        litres: { type: number }
        standaloneSale: { type: boolean, default: false }
    FleetTransactionDto:
      type: object
      properties:
        id: { type: string }
        accountId: { type: string }
        stationId: { type: string }
        vehiclePlate: { type: string }
        driverName: { type: string }
        grade: { type: string }
        litres: { type: number }
        amountFcfa: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    SettleFleetCommand:
      type: object
      required: [stationId, amountFcfa, method]
      properties:
        stationId: { type: string }
        amountFcfa: { type: integer, format: int64 }
        method: { type: string, enum: [BANK_TRANSFER, MOBILE_MONEY, CASH] }
    ShopItemDto:
      type: object
      properties:
        id: { type: string }
        stationId: { type: string }
        sku: { type: string }
        name: { type: string }
        category: { type: string, enum: [LUBRICANT, LPG, SHOP] }
        stockQty: { type: integer }
        reorderLevel: { type: integer }
        unitPriceFcfa: { type: integer, format: int64 }
        unitCostFcfa: { type: integer, format: int64 }
    RecordShopSaleCommand:
      type: object
      required: [itemId, quantity, paymentMethod]
      properties:
        itemId: { type: string }
        quantity: { type: integer, minimum: 1 }
        paymentMethod: { type: string, enum: [CASH, MOBILE_MONEY, CARD] }
    FuelTankDto:
      type: object
      properties:
        id: { type: string }
        stationId: { type: string }
        name: { type: string }
        grade: { type: string, enum: [SUPER, GASOIL, KEROSENE, LPG_BULK, HEAVY_FUEL] }
        capacityLitres: { type: number }
        bookVolumeLitres: { type: number }
        lastDipLitres: { type: number }
        varianceLitres: { type: number }
        unitCostFcfa: { type: integer, format: int64 }
        status: { type: string, enum: [NOMINAL, LOW_STOCK, VARIANCE_ALERT] }
    PurchaseOrderDto:
      type: object
      properties:
        id: { type: string }
        stationId: { type: string }
        supplierName: { type: string }
        grade: { type: string }
        orderedLitres: { type: number }
