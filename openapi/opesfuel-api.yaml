openapi: 3.1.0
info:
  title: OpesFuel API-as-a-Product
  version: 1.0.0
  description: |
    API-first contract for OpesFuel Petrol Station Management Software.
    Designed for Java 25 Spring Boot Modular Monolith (DDD, CQRS, Event-Driven),
    PostgreSQL persistence, Auth0 RBAC JWT security, TypeScript Web App, and Mobile App for Android & iPhone.
    All monetary values are integer FCFA (0 decimal places). Volumes are numeric Litres (L).
  contact:
    name: OpesFuel Platform Engineering
    email: api@opesfuel.com
servers:
  - url: http://localhost:8080/api/v1
    description: Local Java 25 Spring Boot Modular Monolith
  - url: https://api.opesfuel.com/v1
    description: Production API Gateway
security:
  - auth0Bearer: []
  - tenantApiKey: []
tags:
  - name: Stations
  - name: Forecourt
  - name: Inventory
  - name: FleetCredit
  - name: ShopPOS
  - name: Workforce
  - name: Accounting
  - name: ApiPlatform
  - name: Billing
paths:
  /stations:
    get:
      tags: [Stations]
      operationId: listStations
      summary: Query all petrol stations accessible to the tenant
      responses:
        "200":
          description: List of stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StationDto"
    post:
      tags: [Stations]
      operationId: createStation
      summary: Command to onboard a new petrol station
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStationCommand"
      responses:
        "201":
          description: Station created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationDto"
        "403":
          $ref: "#/components/responses/ProblemDetail"

  /stations/{stationId}/fuel-prices:
    get:
      tags: [Stations]
      operationId: listFuelPrices
      summary: Query historical and active fuel prices in FCFA/L for a station
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "200":
          description: Fuel price history ordered newest-first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuelPriceDto"
    post:
      tags: [Stations]
      operationId: updateFuelPrice
      summary: Command to publish a regulatory fuel price change in FCFA/L
      parameters:
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFuelPriceCommand"
      responses:
        "200":
          description: Fuel price updated and FuelPriceUpdatedEvent emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelPriceDto"

  /stations/{stationId}/subscription:
    put:
      tags: [Stations]
      operationId: updateStationSubscription
      summary: Command to update station SaaS subscription tier in FCFA
      parameters:
        - $ref: "#/components/parameters/StationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planName, monthlyFeeFcfa]
              properties:
                planName: { type: string }
                monthlyFeeFcfa: { type: integer, format: int64, minimum: 25000 }
      responses:
        "200":
          description: Station subscription updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationDto"

  /stations/{stationId}:
    put:
      tags: [Stations]
      operationId: updateStation
      summary: Update station code, name, or city metadata
      parameters:
        - $ref: "#/components/parameters/StationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStationCommand"
      responses:
        "200":
          description: Station metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationDto"
    patch:
      tags: [Stations]
      operationId: patchStation
      summary: Partially update station metadata
      parameters:
        - $ref: "#/components/parameters/StationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                name: { type: string }
                city: { type: string }
      responses:
        "200":
          description: Station metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StationDto"
    delete:
      tags: [Stations]
      operationId: deleteStation
      summary: Remove an empty station tenant partition
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "204":
          description: Station deleted
        "409":
          $ref: "#/components/responses/ProblemDetail"

  /catalog/institutional-fuels:
    get:
      tags: [Stations]
      operationId: listInstitutionalFuels
      summary: Query pre-configured institutional fuel grades, capacities, and benchmark prices from database catalog
      security: []
      responses:
        "200":
          description: Institutional fuel catalog

  /stations/{stationId}/onboarding-steps:
    get:
      tags: [Stations]
      operationId: listOnboardingSteps
      summary: Query completed institutional onboarding milestones for a station
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "200":
          description: Completed onboarding steps

  /stations/{stationId}/onboarding-setup:
    post:
      tags: [Stations]
      operationId: applyInstitutionalSetup
      summary: Tick fuels and enter tank capacities & opening litres to synchronize prices, tanks, pumps, and opening capital journal
      parameters:
        - $ref: "#/components/parameters/StationId"
      responses:
        "201":
          description: Station synchronized across inventory, forecourt, and accounting modules

  /ai/subscription:
    get:
      tags: [ApiPlatform]
      operationId: getAiSubscription
      summary: Query Paid AI Copilot subscription state for a station (25,000 FCFA/month)
      responses:
        "200":
          description: Subscription state

  /ai/subscription/activate:
    post:
      tags: [ApiPlatform]
      operationId: activateAiSubscription
      summary: Enable or deactivate the Paid AI Copilot add-on
      responses:
        "200":
          description: Updated subscription state

  /ai/analyze:
    post:
      tags: [ApiPlatform]
      operationId: analyzeStationWithAi
      summary: Run AI stockout horizon prediction, shrinkage risk, and margin analysis (paid feature)
      responses:
        "200":
          description: AI intelligence report

  /ai/chat:
    post:
      tags: [ApiPlatform]
      operationId: chatWithAiAdvisor
      summary: Ask natural-language operational and SYSCOHADA financial questions grounded in live station data
      responses:
        "200":
          description: AI advisor response

  /forecourt/pumps:
    get:
      tags: [Forecourt]
      operationId: listPumps
      summary: Query pump islands and cumulative totalizers for a station
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Pump inventory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PumpDto"
    post:
      tags: [Forecourt]
      operationId: createPump
      summary: Provision a fuel pump dispenser linked to a storage tank
      responses:
        "201":
          description: Pump created

  /forecourt/pumps/{pumpId}:
    patch:
      tags: [Forecourt]
      operationId: patchPump
      summary: Update pump status (IDLE/MAINTENANCE) or unit price
      parameters:
        - name: pumpId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Pump updated
    delete:
      tags: [Forecourt]
      operationId: deletePump
      summary: Remove an idle pump dispenser with no shift history
      parameters:
        - name: pumpId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Pump deleted

  /forecourt/shifts/{shiftId}:
    delete:
      tags: [Forecourt]
      operationId: deleteShift
      summary: Void a forecourt shift record and reverse tank stock, variance, and GL journals if closed
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Shift voided

  /forecourt/shifts:
    get:
      tags: [Forecourt]
      operationId: listShifts
      summary: Query active and historical forecourt shifts
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Shift list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftDto"

  /forecourt/shifts/open:
    post:
      tags: [Forecourt]
      operationId: openShift
      summary: CQRS command to assign an attendant and open a pump shift
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenShiftCommand"
      responses:
        "201":
          description: Shift opened and ShiftOpenedEvent emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftDto"

  /forecourt/shifts/{shiftId}/close:
    post:
      tags: [Forecourt]
      operationId: closeShift
      summary: CQRS command to close shift, compute cash/MoMo/credit variance, deduct tank stock, and post double-entry revenue + COGS journals using authoritative tank WAC
      parameters:
        - name: shiftId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CloseShiftCommand"
      responses:
        "200":
          description: Shift closed and ShiftClosedEvent emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftDto"

  /fleet/accounts:
    get:
      tags: [FleetCredit]
      operationId: listFleetAccounts
      summary: Query corporate postpaid fleet accounts and credit limits in FCFA
      responses:
        "200":
          description: Fleet accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetAccountDto"
    post:
      tags: [FleetCredit]
      operationId: createFleetAccount
      summary: Onboard a corporate postpaid fleet client
      responses:
        "201":
          description: Fleet account created

  /fleet/accounts/{accountId}:
    patch:
      tags: [FleetCredit]
      operationId: patchFleetAccount
      summary: Update corporate fleet credit limit or ACTIVE/HOLD status
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Fleet account updated
    delete:
      tags: [FleetCredit]
      operationId: deleteFleetAccount
      summary: Delete a corporate fleet account with zero balance and no voucher history
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Fleet account deleted

  /fleet/vouchers:
    get:
      tags: [FleetCredit]
      operationId: listFleetVouchers
      summary: Query recent corporate fleet credit dispensing vouchers
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Fleet vouchers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FleetTransactionDto"
    post:
      tags: [FleetCredit]
      operationId: recordFleetVoucher
      summary: Command to record a fleet credit fuel dispensing voucher
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordFleetVoucherCommand"
      responses:
        "201":
          description: Fleet voucher recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetTransactionDto"

  /fleet/accounts/{accountId}/settle:
    post:
      tags: [FleetCredit]
      operationId: settleFleetAccount
      summary: Command to record corporate settlement payment against Accounts Receivable
      parameters:
        - name: accountId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettleFleetCommand"
      responses:
        "200":
          description: Fleet account settled and double-entry cash/AR journal posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetAccountDto"

  /shop/items:
    get:
      tags: [ShopPOS]
      operationId: listShopItems
      summary: Query lubricants, LPG cylinders, and forecourt shop SKUs
      responses:
        "200":
          description: Shop SKUs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShopItemDto"
    post:
      tags: [ShopPOS]
      operationId: createShopItem
      summary: Create a new lubricant, LPG, or forecourt shop SKU
      responses:
        "201":
          description: SKU created

  /shop/items/{itemId}:
    patch:
      tags: [ShopPOS]
      operationId: patchShopItem
      summary: Update shop SKU price, cost, or reorder level
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: SKU updated
    delete:
      tags: [ShopPOS]
      operationId: deleteShopItem
      summary: Delete a shop or lubricant SKU without sales history
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: SKU deleted

  /shop/sales:
    get:
      tags: [ShopPOS]
      operationId: listShopSales
      summary: Query recorded shop/lubricant/LPG sales receipts
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Shop sales receipts
    post:
      tags: [ShopPOS]
      operationId: recordShopSale
      summary: Command to sell lubricant/LPG/shop items and post non-fuel revenue and COGS journal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordShopSaleCommand"
      responses:
        "201":
          description: Shop sale recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopItemDto"

  /shop/items/{itemId}/restock:
    post:
      tags: [ShopPOS]
      operationId: restockShopItem
      summary: Command to restock shop/lubricant/LPG SKU and post Inventory/AP journal
      parameters:
        - name: itemId
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
                unitCostFcfa: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: SKU restocked and Inventory/AP journal posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopItemDto"

  /inventory/tanks:
    get:
      tags: [Inventory]
      operationId: listTanks
      summary: Query underground tank capacities, book levels, and dipstick variances
      responses:
        "200":
          description: Underground fuel tanks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FuelTankDto"
    post:
      tags: [Inventory]
      operationId: createTank
      summary: Provision an underground fuel storage tank
      responses:
        "201":
          description: Tank created

  /inventory/tanks/{tankId}:
    delete:
      tags: [Inventory]
      operationId: deleteTank
      summary: Delete an unreferenced underground storage tank
      parameters:
        - name: tankId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Tank deleted

  /inventory/tanks/{tankId}/reconcile-shrinkage:
    post:
      tags: [Inventory]
      operationId: reconcileTankShrinkage
      summary: Reconcile tank book volume to latest dipstick reading and post shrinkage/gain journal
      parameters:
        - name: tankId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tank reconciled and inventory adjustment posted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelTankDto"

  /inventory/purchase-orders/{poId}:
    delete:
      tags: [Inventory]
      operationId: deletePurchaseOrder
      summary: Delete a non-received supplier purchase order
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Purchase order deleted

  /inventory/purchase-orders/{poId}/cancel:
    patch:
      tags: [Inventory]
      operationId: cancelPurchaseOrder
      summary: Cancel a PENDING supplier purchase order
      parameters:
        - name: poId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Purchase order cancelled

  /inventory/purchase-orders:
    get:
      tags: [Inventory]
      operationId: listPurchaseOrders
      summary: Query supplier tanker purchase orders
      responses:
        "200":
          description: Purchase orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PurchaseOrderDto"
    post:
      tags: [Inventory]
      operationId: createPurchaseOrder
      summary: Command to raise a supplier fuel tanker purchase order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePurchaseOrderCommand"
      responses:
        "201":
          description: Purchase order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseOrderDto"

  /inventory/deliveries:
    get:
      tags: [Inventory]
      operationId: listDeliveries
      summary: Query recent tanker fuel deliveries with BoL vs. actual litres
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Recent tanker deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TankDeliveryDto"
    post:
      tags: [Inventory]
      operationId: receiveDelivery
      summary: Command to receive tanker delivery, validate tank ullage, update WAC, and post inventory/AP journal
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveDeliveryCommand"
      responses:
        "201":
          description: Delivery recorded and FuelDeliveryRecordedEvent emitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelTankDto"

  /inventory/deliveries/{deliveryId}:
    delete:
      tags: [Inventory]
      operationId: voidDelivery
      summary: Void a tanker delivery, reverse tank volume, revert PO, and post reversing Inventory/AP journal
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Delivery voided

  /inventory/dipsticks:
    get:
      tags: [Inventory]
      operationId: listDipsticks
      summary: Query recent physical tank dipstick calibration readings
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Recent dipstick readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DipstickReadingDto"
    post:
      tags: [Inventory]
      operationId: recordDipstick
      summary: Command to record physical tank dipstick measurement and flag evaporation/leakage variance
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordDipstickCommand"
      responses:
        "200":
          description: Dipstick reconciled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FuelTankDto"

  /inventory/dipsticks/{dipstickId}:
    delete:
      tags: [Inventory]
      operationId: deleteDipstick
      summary: Delete a physical dipstick reading record
      parameters:
        - name: dipstickId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Dipstick deleted

  /workforce/employees:
    get:
      tags: [Workforce]
      operationId: listEmployees
      summary: Query station staff, RBAC roles, attendance status, and payroll variance balances
      responses:
        "200":
          description: Employees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EmployeeDto"
    post:
      tags: [Workforce]
      operationId: createEmployee
      summary: Command to onboard a new employee with Auth0 role assignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeCommand"
      responses:
        "201":
          description: Employee created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDto"

  /workforce/employees/{employeeId}:
    put:
      tags: [Workforce]
      operationId: updateEmployee
      summary: Update employee profile, RBAC role, shift window, and base salary
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee updated
    delete:
      tags: [Workforce]
      operationId: deleteEmployee
      summary: Remove an employee record with no shift history
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Employee deleted

  /workforce/employees/{employeeId}/attendance:
    post:
      tags: [Workforce]
      operationId: toggleAttendance
      summary: Command to clock an employee in or out for their rostered shift
      parameters:
        - name: employeeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Attendance updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeDto"

  /workforce/payroll:
    get:
      tags: [Workforce]
      operationId: getPayrollSummary
      summary: CQRS payroll projection including base salary and shortage deductions in FCFA
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Payroll projection
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    employeeId: { type: string }
                    fullName: { type: string }
                    role: { type: string }
                    baseSalaryFcfa: { type: integer, format: int64 }
                    varianceAdjustmentFcfa: { type: integer, format: int64 }
                    netPayableFcfa: { type: integer, format: int64 }

  /workforce/payroll/run:
    post:
      tags: [Workforce]
      operationId: executePayrollRun
      summary: Execute a station payroll disbursement, settle negative shortage deductions, and post payroll expense journal
      responses:
        "201":
          description: Payroll disbursed

  /workforce/payroll/runs:
    get:
      tags: [Workforce]
      operationId: listPayrollRuns
      summary: Query historical payroll runs
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Payroll run history

  /accounting/reports:
    get:
      tags: [Accounting]
      operationId: getFinancialReports
      summary: SQL-aggregated CQRS projection returning P&L, Balance Sheet, Trial Balance, Cash Flow, and VAT/Excise summaries in FCFA
      parameters:
        - name: stationId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Automated financial reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialReportBundleDto"

