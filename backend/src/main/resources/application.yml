server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: opesfuel-platform
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/opesfuel}
    username: ${SPRING_DATASOURCE_USERNAME:opesfuel_app}
    password: ${SPRING_DATASOURCE_PASSWORD:dev_only_password}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 4
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://opesfuel.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://api.opesfuel.com/v1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api/v1/openapi.json
  swagger-ui:
    path: /api/v1/docs

opesfuel:
  auth0:
    # Shared secret the Auth0 post-login Action sends to /public/auth/identity-claims (empty = endpoint disabled).
    action-secret: ${OPESFUEL_AUTH0_ACTION_SECRET:}
  demo:
    # Public walkthrough workspace: browse-only for everyone except PLATFORM_ADMIN.
    tenant-id: ${OPESFUEL_DEMO_TENANT_ID:ten_opes_cm}
    read-only: ${OPESFUEL_DEMO_READ_ONLY:true}
  billing:
    # Expired trial / restricted billing => read-only (HTTP 402); SUSPENDED => blocked.
    enforce-trial-lock: ${OPESFUEL_ENFORCE_TRIAL_LOCK:true}
  currency: FCFA
  starting-monthly-fee-fcfa: 25000
  tax:
    vat-rate: ${OPESFUEL_VAT_RATE:0.1925}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${OPESFUEL_AI_MODEL:gemini-2.5-flash}
    base-url: ${OPESFUEL_AI_BASE_URL:https://generativelanguage.googleapis.com}
    connect-timeout-ms: 5000
    read-timeout-ms: 30000
  webhooks:
    enabled: ${OPESFUEL_WEBHOOKS_ENABLED:true}
    allow-private-targets: ${OPESFUEL_WEBHOOKS_ALLOW_PRIVATE:false}
    poll-interval-ms: 5000
    max-retries: 5
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
  idempotency:
    ttl-hours: 24
  leads:
    rate-limit-per-minute: 20
  security:
    # Fail closed: a login without a tenant_id claim is rejected (never defaults to the demo tenant).
    allow-default-tenant-fallback: ${OPESFUEL_ALLOW_DEFAULT_TENANT_FALLBACK:false}
    encryption-key: ${OPESFUEL_ENCRYPTION_KEY:dev-only-opesfuel-32-byte-secret-key-change-me}
  notifications:
    webhook-url: ${OPESFUEL_ALERTS_WEBHOOK_URL:}
  momo:
    reconcile-enabled: ${OPESFUEL_MOMO_RECONCILE_ENABLED:true}
    reconcile-interval-ms: ${OPESFUEL_MOMO_RECONCILE_INTERVAL_MS:60000}
    tx-expiry-minutes: ${OPESFUEL_MOMO_TX_EXPIRY_MINUTES:15}
    mtn:
      base-url: ${OPESFUEL_MTN_BASE_URL:https://sandbox.momodeveloper.mtn.com}
      target-environment: ${OPESFUEL_MTN_TARGET_ENV:sandbox}
      api-user: ${OPESFUEL_MTN_API_USER:}
      api-key: ${OPESFUEL_MTN_API_KEY:}
      collection-subscription-key: ${OPESFUEL_MTN_COLLECTION_SUBSCRIPTION_KEY:}
      disbursement-subscription-key: ${OPESFUEL_MTN_DISBURSEMENT_SUBSCRIPTION_KEY:}
      callback-url: ${OPESFUEL_MTN_CALLBACK_URL:}
    orange:
      base-url: ${OPESFUEL_ORANGE_BASE_URL:https://api.orange.com}
      environment: ${OPESFUEL_ORANGE_ENV:dev}
      client-id: ${OPESFUEL_ORANGE_CLIENT_ID:}
      client-secret: ${OPESFUEL_ORANGE_CLIENT_SECRET:}
      merchant-key: ${OPESFUEL_ORANGE_MERCHANT_KEY:}
      return-url: ${OPESFUEL_ORANGE_RETURN_URL:https://app.opesfuel.com/#/app/admin}
      cancel-url: ${OPESFUEL_ORANGE_CANCEL_URL:https://app.opesfuel.com/#/app/admin}
      notif-url: ${OPESFUEL_ORANGE_NOTIF_URL:}
      lang: ${OPESFUEL_ORANGE_LANG:fr}
  mail:
    provider: ${OPESFUEL_MAIL_PROVIDER:LOG_ONLY}
    api-key: ${OPESFUEL_MAIL_API_KEY:}
    from: ${OPESFUEL_MAIL_FROM:noreply@opesfuel.com}
    smtp:
      host: ${OPESFUEL_SMTP_HOST:}
      port: ${OPESFUEL_SMTP_PORT:587}
      username: ${OPESFUEL_SMTP_USERNAME:}
      password: ${OPESFUEL_SMTP_PASSWORD:}
      starttls: ${OPESFUEL_SMTP_STARTTLS:true}
      ssl: ${OPESFUEL_SMTP_SSL:false}
  sms:
    provider: ${OPESFUEL_SMS_PROVIDER:LOG_ONLY}
    africastalking:
      username: ${OPESFUEL_AT_USERNAME:}
      api-key: ${OPESFUEL_AT_API_KEY:}
      from: ${OPESFUEL_AT_FROM:OPESFUEL}
    twilio:
      account-sid: ${OPESFUEL_TWILIO_ACCOUNT_SID:}
      auth-token: ${OPESFUEL_TWILIO_AUTH_TOKEN:}
      from: ${OPESFUEL_TWILIO_FROM:}
  whatsapp:
    provider: ${OPESFUEL_WHATSAPP_PROVIDER:LOG_ONLY}
    meta:
      phone-number-id: ${OPESFUEL_WHATSAPP_PHONE_NUMBER_ID:}
      access-token: ${OPESFUEL_WHATSAPP_ACCESS_TOKEN:}

