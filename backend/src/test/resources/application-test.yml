spring:
  datasource:
    url: jdbc:h2:mem:opesfuel_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ""
          jwk-set-uri: http://localhost:0/.well-known/jwks.json

opesfuel:
  security:
    allow-default-tenant-fallback: true
  demo:
    read-only: false
  billing:
    enforce-trial-lock: false
  webhooks:
    enabled: false
    allow-private-targets: false
  idempotency:
    cleanup-enabled: false
  tax:
    vat-rate: 0.1925
