name: OpesFuel CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-java25:
    name: Backend (Java 25 · Spring Boot 3.5 · 81 JUnit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Flyway migration ordering (V1..V26)
        run: |
          ls -1 backend/src/main/resources/db/migration/V*.sql | sort -V
          COUNT=$(ls -1 backend/src/main/resources/db/migration/V*.sql | wc -l)
          echo "Found $COUNT Flyway migrations"
          test "$COUNT" -ge 26

      - name: Run full JUnit 5 & ArchUnit suite
        run: mvn -B -f backend/pom.xml test

      - name: Package executable production JAR
        run: mvn -B -f backend/pom.xml package -DskipTests

  frontend-web:
    name: Frontend (Node 24 · TypeScript · Vite Production Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict typecheck
        run: npm run lint

      - name: Build production bundle
        run: npm run build

      - name: Verify bundle output
        run: |
          test -f dist/index.html
          ls -lh dist/assets/*.js

  deploy-preflight:
    name: Production Ops & Deploy Script Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint shell ops scripts
        run: |
          bash -n deploy/backup-postgres.sh
          bash -n deploy/restore-postgres.sh
          bash -n deploy/smoke-test.sh
          bash -n deploy/preflight.sh
          bash -n deploy/deploy.sh
          bash -n deploy/verify-public.sh
          bash -n deploy/rollback.sh

      - name: Validate docker-compose.prod.yml syntax
        env:
          SPRING_DATASOURCE_PASSWORD: ci_placeholder_password
          AUTH0_ISSUER_URI: https://ci.opesfuel.example.com/
          OPESFUEL_ENCRYPTION_KEY: ci_placeholder_32byte_encryption_key
          OPESFUEL_CORS_ALLOWED_ORIGINS: https://app.opesfuel.com
        run: docker compose -f docker-compose.prod.yml --profile tls config -q

  mcp-connector:
    name: MCP connector (Node 22 · typecheck · 8 end-to-end tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Run tests
        run: npm test

  mobile-logic:
    name: Mobile app logic (Node 22 · 15 unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install test runner only (the tests need no Expo packages)
        run: npm install --no-save --no-package-lock tsx@4.19.2

      - name: Run tests
        run: npx tsx --tsconfig test/tsconfig.json --test test/*.test.ts
