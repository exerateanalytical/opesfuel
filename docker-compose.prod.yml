services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opesfuel}
      POSTGRES_USER: ${POSTGRES_USER:-opesfuel_app}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    volumes:
      - opesfuel_pgdata:/var/lib/postgresql/data
      - ./deploy/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opesfuel_app} -d ${POSTGRES_DB:-opesfuel}"]
      interval: 10s
      timeout: 5s
      retries: 10

  opesfuel-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-opesfuel}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-opesfuel_app}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      AUTH0_ISSUER_URI: ${AUTH0_ISSUER_URI:?AUTH0_ISSUER_URI is required}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.opesfuel.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPESFUEL_AI_MODEL: ${OPESFUEL_AI_MODEL:-gemini-2.5-flash}
      OPESFUEL_VAT_RATE: ${OPESFUEL_VAT_RATE:-0.1925}
      OPESFUEL_ENCRYPTION_KEY: ${OPESFUEL_ENCRYPTION_KEY:?OPESFUEL_ENCRYPTION_KEY is required}
      OPESFUEL_CORS_ALLOWED_ORIGINS: ${OPESFUEL_CORS_ALLOWED_ORIGINS:?OPESFUEL_CORS_ALLOWED_ORIGINS is required}
      OPESFUEL_ALERTS_WEBHOOK_URL: ${OPESFUEL_ALERTS_WEBHOOK_URL:-}
      OPESFUEL_MAIL_PROVIDER: ${OPESFUEL_MAIL_PROVIDER:-LOG_ONLY}
      OPESFUEL_MAIL_API_KEY: ${OPESFUEL_MAIL_API_KEY:-}
      OPESFUEL_MAIL_FROM: ${OPESFUEL_MAIL_FROM:-noreply@opesfuel.com}
      OPESFUEL_SMTP_HOST: ${OPESFUEL_SMTP_HOST:-}
      OPESFUEL_SMTP_PORT: ${OPESFUEL_SMTP_PORT:-587}
      OPESFUEL_SMTP_USERNAME: ${OPESFUEL_SMTP_USERNAME:-}
      OPESFUEL_SMTP_PASSWORD: ${OPESFUEL_SMTP_PASSWORD:-}
      OPESFUEL_SMTP_STARTTLS: ${OPESFUEL_SMTP_STARTTLS:-true}
      OPESFUEL_SMTP_SSL: ${OPESFUEL_SMTP_SSL:-false}
      OPESFUEL_SMS_PROVIDER: ${OPESFUEL_SMS_PROVIDER:-LOG_ONLY}
      OPESFUEL_AT_USERNAME: ${OPESFUEL_AT_USERNAME:-}
      OPESFUEL_AT_API_KEY: ${OPESFUEL_AT_API_KEY:-}
      OPESFUEL_AT_FROM: ${OPESFUEL_AT_FROM:-OPESFUEL}
      OPESFUEL_TWILIO_ACCOUNT_SID: ${OPESFUEL_TWILIO_ACCOUNT_SID:-}
      OPESFUEL_TWILIO_AUTH_TOKEN: ${OPESFUEL_TWILIO_AUTH_TOKEN:-}
      OPESFUEL_TWILIO_FROM: ${OPESFUEL_TWILIO_FROM:-}
      OPESFUEL_WHATSAPP_PROVIDER: ${OPESFUEL_WHATSAPP_PROVIDER:-LOG_ONLY}
      OPESFUEL_WHATSAPP_PHONE_NUMBER_ID: ${OPESFUEL_WHATSAPP_PHONE_NUMBER_ID:-}
      OPESFUEL_WHATSAPP_ACCESS_TOKEN: ${OPESFUEL_WHATSAPP_ACCESS_TOKEN:-}
      OPESFUEL_MTN_BASE_URL: ${OPESFUEL_MTN_BASE_URL:-https://sandbox.momodeveloper.mtn.com}
      OPESFUEL_MTN_TARGET_ENV: ${OPESFUEL_MTN_TARGET_ENV:-sandbox}
      OPESFUEL_MTN_API_USER: ${OPESFUEL_MTN_API_USER:-}
      OPESFUEL_MTN_API_KEY: ${OPESFUEL_MTN_API_KEY:-}
      OPESFUEL_MTN_COLLECTION_SUBSCRIPTION_KEY: ${OPESFUEL_MTN_COLLECTION_SUBSCRIPTION_KEY:-}
      OPESFUEL_MTN_DISBURSEMENT_SUBSCRIPTION_KEY: ${OPESFUEL_MTN_DISBURSEMENT_SUBSCRIPTION_KEY:-}
      OPESFUEL_MTN_CALLBACK_URL: ${OPESFUEL_MTN_CALLBACK_URL:-}
      OPESFUEL_ORANGE_BASE_URL: ${OPESFUEL_ORANGE_BASE_URL:-https://api.orange.com}
      OPESFUEL_ORANGE_ENV: ${OPESFUEL_ORANGE_ENV:-dev}
      OPESFUEL_ORANGE_CLIENT_ID: ${OPESFUEL_ORANGE_CLIENT_ID:-}
      OPESFUEL_ORANGE_CLIENT_SECRET: ${OPESFUEL_ORANGE_CLIENT_SECRET:-}
      OPESFUEL_ORANGE_MERCHANT_KEY: ${OPESFUEL_ORANGE_MERCHANT_KEY:-}
      OPESFUEL_ORANGE_RETURN_URL: ${OPESFUEL_ORANGE_RETURN_URL:-https://app.opesfuel.com/#/app/admin}
      OPESFUEL_ORANGE_CANCEL_URL: ${OPESFUEL_ORANGE_CANCEL_URL:-https://app.opesfuel.com/#/app/admin}
      OPESFUEL_ORANGE_NOTIF_URL: ${OPESFUEL_ORANGE_NOTIF_URL:-}
      OPESFUEL_PAYMENT_WEBHOOK_SECRET: ${OPESFUEL_PAYMENT_WEBHOOK_SECRET:-}
      OPESFUEL_PAYMENT_CHECKOUT_BASE_URL: ${OPESFUEL_PAYMENT_CHECKOUT_BASE_URL:-https://pay.opesfuel.com/checkout}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health || wget -qO- http://127.0.0.1:8080/actuator/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 35s
    depends_on:
      postgres:
        condition: service_healthy

  opesfuel-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_BASE_URL:-https://api.opesfuel.com}
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-https://api.opesfuel.com/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      OPESFUEL_BACKEND_URL: http://opesfuel-backend:8080
      OPESFUEL_AI_MODEL: ${OPESFUEL_AI_MODEL:-gemini-2.5-flash}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    depends_on:
      opesfuel-backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    environment:
      OPESFUEL_DOMAIN: ${OPESFUEL_DOMAIN:-app.opesfuel.com}
      OPESFUEL_API_DOMAIN: ${OPESFUEL_API_DOMAIN:-api.opesfuel.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      opesfuel-web:
        condition: service_healthy

volumes:
  opesfuel_pgdata:
  caddy_data:
  caddy_config:
